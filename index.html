<style id="app-style">
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
:root {
  --bg: #EEF1F4;
  --card: #FFFFFF;
  --ink: #17202B;
  --mute: #566273;
  --line: #D5DCE4;
  --accent: #1F6C8A;
  --accent-soft: #E3EEF3;
  --blue: #2F6FD0;
  --red: #C8433B;
  --other: #7A8696;
  --vio: #6D28D9;
  --vio-s: #EDE9FE;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151C; --card: #16202A; --ink: #E7EDF3; --mute: #94A2B2; --line: #2A3642;
    --accent: #62B4D6; --accent-soft: #1B2C37; --blue: #6C9BEA; --red: #E4776F; --other: #8F9CAB;
    --vio: #B79CFF; --vio-s: #2A2142;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151C; --card: #16202A; --ink: #E7EDF3; --mute: #94A2B2; --line: #2A3642;
  --accent: #62B4D6; --accent-soft: #1B2C37; --blue: #6C9BEA; --red: #E4776F; --other: #8F9CAB;
  --vio: #B79CFF; --vio-s: #2A2142;
  color-scheme: dark;
}
html, body { background: var(--bg); }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
#app { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, .num { font-family: var(--font-display); }
h1 { font-size: 40px; line-height: 1; margin: 0; letter-spacing: 0.01em; text-transform: uppercase; font-weight: 700; text-wrap: balance; }
h2 { font-size: 22px; margin: 0 0 8px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: var(--accent); text-wrap: balance; }
.sub { color: var(--mute); margin: 6px 0 0; }
.help { color: var(--mute); font-size: 14px; margin: 0 0 10px; }
.notice { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
.stat { padding: 12px 16px; min-width: 0; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat .lab { color: var(--mute); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
.stat .num { font-size: 36px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .hint { color: var(--mute); font-size: 13px; }
.empty { color: var(--mute); padding: 6px 0; }
.chart-wrap { overflow-x: auto; }
svg.chart { width: 100%; min-width: 420px; height: auto; display: block; }
svg.chart text { fill: var(--mute); font-family: var(--font-body); font-size: 11px; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .ln { stroke: var(--accent); stroke-width: 2; fill: none; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
th { font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--mute); font-weight: 600; }
td.r, th.r { text-align: right; }
td .note { display: block; color: var(--mute); font-size: 13px; white-space: normal; max-width: 260px; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; }
.pill.Blue { background: var(--blue); } .pill.Red { background: var(--red); } .pill.Other { background: var(--other); }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 12px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.link { border: 0; background: none; color: var(--accent); padding: 2px 6px; }
button.danger { color: var(--red); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
form.entry { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--mute); min-width: 0; }
input, select, textarea { font: inherit; font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; width: 100%; }
textarea { font-family: var(--font-mono); font-size: 14px; min-height: 150px; resize: vertical; }
.span2 { grid-column: span 2; }
.form-actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.msg { color: var(--red); font-size: 14px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.who { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 0 0 4px; }
.task { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--line); text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--ink); flex-direction: row; }
.task:last-child { border-bottom: 0; }
.task input { width: 18px; height: 18px; margin-top: 3px; flex: none; padding: 0; accent-color: var(--accent); }
.task .t { min-width: 0; }
.task .w { color: var(--mute); font-size: 13px; }
.task.done .t b { text-decoration: line-through; color: var(--mute); font-weight: 500; }
.weekbar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-bottom: 10px; }
.weekbar label { flex: 1 1 240px; }
.post { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.post-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.post-head .lab { color: var(--mute); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
pre.out { margin: 0; padding: 10px 12px; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 6px; font-family: var(--font-mono); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.skip { color: var(--red); font-size: 13px; margin-top: 6px; }

.tabs { display: flex; gap: 6px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 8px 0; }
.tabs button { flex: 1; min-height: 46px; font-weight: 600; font-size: 16px; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.pg { display: flex; flex-direction: column; gap: 22px; }
.pg[hidden] { display: none; }
.gt { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 14px 0 2px; }
.mcard { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.mcard .mb { flex: 1; min-width: 0; }
.mcard pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
.mcard.mono pre { font-family: var(--font-mono); font-size: 14px; }
.mcard button { flex: none; min-height: 44px; min-width: 88px; }
.mcard .gl { color: var(--mute); font-size: 13px; margin-top: 4px; }
.ph { background: var(--accent-soft); border-radius: 3px; padding: 0 2px; }
.tg { display: flex; gap: 10px; align-items: center; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--ink); flex-direction: row; min-height: 44px; }
.tg input { width: 20px; height: 20px; padding: 0; accent-color: var(--accent); }
.wchip { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; white-space: nowrap; vertical-align: middle; letter-spacing: 0; text-transform: none; font-family: var(--font-body); }
.wchip.ewa { background: var(--vio-s); color: var(--vio); }
.wchip.kaya { background: var(--accent-soft); color: var(--accent); }
.wchip.both { background: var(--line); color: var(--ink); }
.dsub { display: block; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--mute); font-size: 14px; font-family: var(--font-body); }
.pg > section { scroll-margin-top: 120px; }
.grow { display: flex; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
.grow button { width: 96px; flex: none; text-align: left; font-weight: 700; padding: 2px 0; }
.mbtn { display: flex; gap: 6px; flex: none; }
.medit { font-family: var(--font-body); font-size: 16px; line-height: 1.45; width: 100%; min-height: 70px; }
.mcard.mono .medit { font-family: var(--font-mono); font-size: 14px; }
@media (max-width: 520px) { .mcard { flex-direction: column; } .mcard .mb { width: 100%; } .mbtn { align-self: flex-end; } }
@media (max-width: 520px) { h1 { font-size: 32px; } .span2 { grid-column: auto; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<script id="app-script">
(function () {
  'use strict';
  var TASKS = [
    { k: 'last',  who: 'Ewa',  when: 'Mon, 2h before BE ends', t: 'Last raid + one last call for spare GB tickets (backup: Kaya)' },
    { k: 'row',   who: 'Ewa',  when: 'Mon, BE ends',      t: 'Add this BE to the log (5 min), then copy the "Last BE stats" post from here' },
    { k: 'stats', who: 'Ewa',  when: 'Mon',               t: 'Posts "Last BE stats" in Announcements + thanks post' },
    { k: 'loot',  who: 'Ewa',  when: 'After BE',          t: 'Loot by number of GBs hit' },
    { k: 'wp',    who: 'Kaya', when: 'Tue',               t: 'Weapons + talents post, Monster Slayer list (box below) + gear scheme reminder' },
    { k: 'chk',   who: 'Kaya', when: 'Tue',               t: 'One private DM to each member who skipped BE, then a short summary to Ewa' },
    { k: 'shop',  who: 'Ewa',  when: 'Wed',               t: 'New season shop message, GM matters, DM to members who missed 3 BEs in a row' },
    { k: 'pv',    who: 'Kaya', when: 'Thu',               t: 'BE preview + raid times (Ewa posts the GB run order as now)' },
    { k: 'fri',   who: 'Ewa',  when: 'Fri',               t: 'BE start posts as now + raid reminder' },
    { k: 'raid',  who: 'Kaya', when: 'Sat',               t: 'GB raid call at the fixed UTC time' },
    { k: 'raid2', who: 'Ewa',  when: 'Sun',               t: 'GB raid call, same UTC time' },
    { k: 'inv',   who: 'Kaya', when: 'Any day',           t: 'Invite DMs, only guildless New Comers who are getting stronger' }
  ];

  var CFG = window.PACK_CONFIG || {};
  function kvDefault(k) { return k === 'week' ? { label: '', stages: '', done: {} } : {}; }
  /* Shared state is stored one field per kv row ('week:label', 'week:stages', 'week:done:<task>',
     'msgs:<id>', 'notes:<day>'), so two people editing different fields never overwrite each other.
     A missing row means the field is empty / unticked / unedited. */
  function getField(fk) {
    var p = fk.split(':');
    if (p[0] === 'week') return p[1] === 'done' ? (S.week.done[p[2]] ? true : undefined) : S.week[p[1]];
    var v = S[p[0]] && S[p[0]][p[1]];
    return typeof v === 'string' ? v : undefined;
  }
  function setField(fk, v) {
    var p = fk.split(':');
    if (p[0] === 'week') {
      if (p[1] === 'done' && p[2]) { if (v === true) S.week.done[p[2]] = true; else delete S.week.done[p[2]]; }
      else if (p[1] === 'label' || p[1] === 'stages') S.week[p[1]] = typeof v === 'string' ? v : '';
    } else if ((p[0] === 'msgs' || p[0] === 'notes') && p[1]) {
      if (typeof v === 'string') S[p[0]][p[1]] = v; else delete S[p[0]][p[1]];
    }
  }
  function isFieldKey(k) { return /^(week:(label|stages|done:.+)|msgs:.+|notes:.+)$/.test(k); }
  function kvPending(fk) { return !!(kvTimers[fk] || kvBusy[fk]); }

      ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
      document.body.appendChild(ta);
      ta.focus(); ta.select(); try { ta.setSelectionRange(0, text.length); } catch (e) {}
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      return ok;
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { navigator.clipboard.writeText(text).then(function () { cb(true); }, function () { cb(fallback()); }); return; }

    var olds = document.querySelectorAll('textarea[id^="nt"]');
    for (var q = 0; q < olds.length; q++) if (olds[q].value !== olds[q].defaultValue) drafts[olds[q].id] = olds[q].value;
    var n = 0;
    var h = '<div class="daynav">' + MSGS.map(function (sec, di) { return '<button type="button" data-jump="day' + di + '"' + (sec.nb === false && sec.s !== 'Any day' ? ' class="rec"' : '') + '>' + esc(sec.s.replace('Recruiting new players', 'Recruiting').replace(/^(\w{3})\w*day$/, '$1').replace('Any day', 'Any')) + '</button>'; }).join('') + '</div><div class="panel"><p class="help" style="margin:0 0 10px">Sorted Monday to Sunday. The chip shows who posts it. Tap Copy, then paste into the game chat or Announcements. ' + (readOnly ? '' : 'Tap Edit to change a message for everyone, Reset brings the original back. ') + 'Highlighted [brackets] are the parts to fill in. Chat messages are 140 characters or less.</p>' +
      '<details><summary style="cursor:pointer;font-weight:700">Week at a glance</summary>' +
      MSGS.map(function (sec, di) { return '<div class="grow"><button type="button" class="link" data-jump="day' + di + '">' + esc(sec.s) + '</button><div>' + (sec.o ? chip(sec.o) + '<br>' : '') + sec.g.map(function (g) { return esc(g.t); }).join('<br>') + '</div></div>'; }).join('') + '</details></div>';
    MSGS.forEach(function (sec, di) {
      h += '<section id="day' + di + '"><h2>' + esc(sec.s) + ' ' + (sec.o ? chip(sec.o) : '') + '<span class="dsub">' + esc(sec.sub) + '</span></h2>';
      sec.g.forEach(function (g) {
        h += '<h3 class="gt">' + esc(g.t) + ' ' + (g.w !== sec.o ? chip(g.w) : '') + '</h3>' + (g.n ? '<p class="help">' + esc(g.n) + '</p>' : '');
        g.m.forEach(function (m) {
          var id = 'm' + (n++), key = hk(m[0]);
          ORIG[key] = m[0];
          var edited = typeof S.msgs[key] === 'string', text = edited ? S.msgs[key] : m[0], body, btns;
          if (editKey === key && !readOnly) {
            body = '<textarea class="medit" id="ed_' + id + '" rows="' + Math.max(2, text.split('\n').length + 1) + '" maxlength="1500">' + esc(text) + '</textarea>';
            btns = '<button type="button" class="primary" data-save="' + key + '" data-ed="ed_' + id + '">Save</button><button type="button" data-cancel="1">Cancel</button>';
          } else {
            body = '<pre id="' + id + '">' + esc(text).replace(/\[[^\]\n]+\]/g, function (x) { return '<span class="ph">' + x + '</span>'; }) + '</pre>' +
              (edited ? '<div class="gl">Edited' + (readOnly ? '' : ' <button type="button" class="link" data-reset="' + key + '">Reset to original</button>') + '</div>' : '');
            btns = (readOnly ? '' : '<button type="button" data-edit="' + key + '">Edit</button>') + '<button class="primary" type="button" data-copy="' + id + '">Copy</button>';
          }
          h += '<div class="mcard o-' + wcls(g.w) + (g.a ? ' mono' : '') + '"><div class="mb">' + body + '</div><div class="mbtn">' + btns + '</div></div>';
        });
      });
      if (sec.s === 'Tracking') h += '<button class="primary" type="button" data-tab="tracker" style="margin-top:6px">Open the Tracker tab</button>';
      if (sec.nb) {
        var nv = (S.notes && typeof S.notes[di] === 'string') ? S.notes[di] : '';
        h += '<h3 class="gt">Your own message (optional)</h3><p class="help">Optional. Write anything you like for this day. You can change or clear it whenever you want' + (readOnly ? '.' : '. Shared with everyone.') + '</p>' +
          '<div class="mcard"><div class="mb"><textarea class="medit" id="nt' + di + '" rows="3" maxlength="1500"' + (readOnly ? ' readonly' : '') + ' placeholder="Your message for ' + esc(sec.s) + '...">' + esc(nv) + '</textarea></div><div class="mbtn">' + (readOnly ? '' : '<button type="button" data-nsave="' + di + '">Save</button>') + '<button class="primary" type="button" data-ncopy="' + di + '">Copy</button></div></div>';
      }
      h += '</section>';
    });
    $('pgMsgs').innerHTML = h;
    for (var dk in drafts) { var el = $(dk); if (el) el.value = drafts[dk]; }
  }
  function showTab(name) {
    $('pgTracker').hidden = name !== 'tracker';
    $('pgMsgs').hidden = name !== 'messages';
    var bs = document.querySelectorAll('.tabs button');
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-selected', bs[i].getAttribute('data-tab') === name ? 'true' : 'false');
  }
  function tabFromHash() { return (location.hash === '#messages') ? 'messages' : 'tracker'; }
  window.addEventListener('hashchange', function () { if (booted) showTab(tabFromHash()); });

  /* ---------- login and boot ---------- */
  function showLogin(msg) {
    booted = false;
    $('app').innerHTML = heroHtml(false) +
      '<div class="login panel"><h2>Log in</h2><form id="loginForm" novalidate>' +
      '<label>Username<input id="lgUser" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>' +
      '<label>Password<input id="lgPass" name="password" type="password" autocomplete="current-password" required></label>' +
      '<button class="primary" type="submit" id="lgBtn">Log in</button>' +
      '<span class="msg" id="lgMsg" role="alert">' + esc(msg || '') + '</span></form></div>';
    var u = $('lgUser'); if (u && !('ontouchstart' in window)) u.focus();
  }
  function doLogin() {
    var u = $('lgUser').value.trim().toLowerCase(), p = $('lgPass').value, m = $('lgMsg'), btn = $('lgBtn');
    if (!u || !p) { m.textContent = 'Enter your username and password.'; return; }
    var email = u.indexOf('@') > -1 ? u : u + '@thepack.app';
    btn.disabled = true; btn.textContent = 'Logging in...'; m.textContent = '';
    sb.auth.signInWithPassword({ email: email, password: p }).then(function (r) {
      if (r.error) {
        var st = r.error.status;
        m.textContent = st === 429 ? 'Too many tries. Wait a minute and try again.' :
          (st === 400 || /invalid/i.test(r.error.message || '')) ? 'Wrong username or password.' :
          'Could not log in. Check the connection and try again.';
        btn.disabled = false; btn.textContent = 'Log in';
        return;
      }
      enter(r.data.session);
    }, function () {
      m.textContent = 'Could not log in. Check the connection and try again.';
      btn.disabled = false; btn.textContent = 'Log in';
    });
  }
  function showLoading() {
    $('app').innerHTML = '<div id="top">' + heroHtml(true) + '</div><div class="panel"><div class="empty" id="loadMsg">Loading...</div></div>';
    booted = false;
  }
  function loadFailed(err) {
    console.warn('load failed', err);
    var el = $('loadMsg');
    if (el) el.innerHTML = 'Could not load the data. <button type="button" class="primary" data-act="reload">Try again</button>';
  }
  function bootShell() {
    $('app').innerHTML = '<div id="top"></div><nav class="tabs" aria-label="Pages"><button type="button" data-tab="tracker" aria-selected="true">Tracker</button><button type="button" data-tab="messages" aria-selected="false">Messages</button></nav>' +
      '<div id="pgTracker" class="pg"><section id="summary"></section><section id="chartwrap"></section>' +
      '<section><h2>Last BE stats post</h2><div id="statswrap"></div></section>' +
      '<section><h2>BE log</h2><div id="logwrap"></div></section>' +
      '<section><h2>Add a BE</h2><div id="formwrap"></div></section>' +
      '<section><h2>Monster Slayer posts</h2><div id="stagewrap"></div></section>' +
      '<section><h2>This week</h2><div id="checkwrap"></div></section></div><div id="pgMsgs" class="pg" hidden></div>';
    booted = true;
    renderAll(); renderMsgs(); showTab(tabFromHash());
  }
  function enter(session) {
    user = session.user;
    uname = String(user.email || '').split('@')[0];
    showLoading();
    subscribe();
    loadAll(false).catch(loadFailed);
  }
  function leave() {
    if (channel) { try { sb.removeChannel(channel); } catch (e) {} channel = null; }
    for (var k in kvTimers) clearTimeout(kvTimers[k]);
    kvTimers = {}; kvBusy = {}; kvSkipped = {}; failed = {}; inflight = 0; statusText = ''; statusErr = false;
    S = { entries: [], week: kvDefault('week'), msgs: {}, notes: {} };
    user = null; uname = ''; editingId = null; selId = null; editKey = null;
    showLogin();
  }
  function start() {
    if (!window.supabase || !CFG.url || !CFG.anonKey) {
      $('app').innerHTML = heroHtml(false) + '<div class="panel"><div class="empty">Could not start. Check the connection and reload the page.</div></div>';
      return;
    }
    sb = window.supabase.createClient(CFG.url, CFG.anonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'pack-auth' }
    });
    sb.auth.onAuthStateChange(function (ev) {
      if (ev === 'SIGNED_OUT') setTimeout(function () { if (user) leave(); }, 0);
    });
    sb.auth.getSession().then(function (r) {
      var s = r.data && r.data.session;
      if (s) enter(s); else showLogin();
    }, function () { showLogin(); });
  }
  start();
})();
</script>
</body>
</html>
